<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Ecuestre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ec;
      --surface: #ffffff;
      --ink: #2b211a;
      --muted: #7a6a5c;
      --line: #e6dccf;
      --accent: #7b4a2a;
      --accent-ink: #ffffff;
      --chip: #efe6da;
      --shadow: 0 1px 2px rgba(43, 33, 26, .06), 0 4px 16px rgba(43, 33, 26, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1612;
        --surface: #26201b;
        --ink: #f1e9df;
        --muted: #b3a493;
        --line: #3a312a;
        --accent: #c98a5b;
        --accent-ink: #1b1612;
        --chip: #322a23;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
    }

    /* ---------- Cabecera fija ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    .brand {
      font-family: "Playfair Display", serif;
      font-size: 1.5rem;
      margin: 0;
      padding: 14px 0 10px;
    }

    .tabs { display: flex; gap: 8px; }
    .tab {
      flex: 1;
      max-width: 260px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      font: 600 1rem Inter, sans-serif;
      cursor: pointer;
    }
    .tab[aria-selected="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--ink);
      font: 500 .92rem Inter, sans-serif;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .chip.active { border-color: var(--accent); color: var(--accent); }
    .chip .count { color: var(--muted); font-weight: 400; margin-left: 4px; }

    /* ---------- Secciones ---------- */
    main { padding: 8px 0 64px; }
    .categoria[hidden] { display: none; }
    section.sub { padding-top: 28px; }
    section.sub[hidden] { display: none; }
    section.sub h2 {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      margin: 0 0 14px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    section.sub h2 small { font: 400 .85rem Inter, sans-serif; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      align-items: start;
      gap: 16px;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .card button.foto {
      all: unset;
      cursor: zoom-in;
      display: block;
      position: relative;
      aspect-ratio: 1;
      background: var(--chip);
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .mas-fotos {
      position: absolute;
      right: 8px;
      bottom: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      font-size: .78rem;
      font-weight: 600;
    }
    .card .info { padding: 10px 12px 12px; }
    .card .nombre { font-weight: 600; margin: 0; }
    .card .detalle { color: var(--muted); font-size: .88rem; margin: 2px 0 0; }
    .card .precio { color: var(--accent); font-weight: 600; margin: 6px 0 0; }

    .vacio {
      border: 1.5px dashed var(--line);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }

    .arriba {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .arriba.visible { opacity: 1; pointer-events: auto; }

    /* ---------- Visor de fotos ---------- */
    dialog {
      border: none;
      padding: 0;
      background: transparent;
      max-width: min(92vw, 900px);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .85); }
    dialog img { max-width: 100%; max-height: 80vh; display: block; margin: 0 auto; border-radius: 8px; }
    dialog p { color: #fff; text-align: center; margin: 10px 0 0; }
    dialog .flecha {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      color: #000;
      font-size: 1.4rem;
      cursor: pointer;
    }
    dialog .flecha.ant { left: 12px; }
    dialog .flecha.sig { right: 12px; }
    dialog .flecha[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 class="brand">Catálogo Ecuestre</h1>
      <div class="tabs" role="tablist" id="tabs"></div>
      <nav class="chips" id="chips" aria-label="Subsecciones"></nav>
    </div>
  </header>

  <main class="wrap" id="contenido"></main>

  <button class="arriba" id="arriba" aria-label="Volver arriba">↑</button>

  <dialog id="visor">
    <img alt="">
    <p></p>
    <button class="flecha ant" aria-label="Foto anterior">‹</button>
    <button class="flecha sig" aria-label="Foto siguiente">›</button>
  </dialog>

  <script src="productos.js"></script>
  <script>
    const tabsEl = document.getElementById("tabs");
    const chipsEl = document.getElementById("chips");
    const mainEl = document.getElementById("contenido");
    const visor = document.getElementById("visor");

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // ----- Armar el contenido -----
    CATALOGO.forEach((cat) => {
      const tab = document.createElement("button");
      tab.className = "tab";
      tab.role = "tab";
      tab.textContent = cat.titulo;
      tab.dataset.cat = cat.id;
      tabsEl.appendChild(tab);

      const div = document.createElement("div");
      div.className = "categoria";
      div.dataset.cat = cat.id;
      mainEl.appendChild(div);
    });

    // Un producto puede tener una foto ("foto") o varias ("fotos")
    const fotosDe = (p) => p.fotos || (p.foto ? [p.foto] : []);
    let galerias = [];

    function armar() {
      galerias = [];
      CATALOGO.forEach((cat) => {
        mainEl.querySelector(`.categoria[data-cat="${cat.id}"]`).innerHTML = cat.secciones.map((sec) => {
          const carpeta = `fotos/${cat.id}/${sec.id}/`;
          const items = sec.productos.length
            ? `<div class="grid">${sec.productos.map((p) => {
                const fotos = fotosDe(p).map((f) => carpeta + f);
                const g = galerias.push({ fotos, nombre: p.nombre }) - 1;
                return `
                <article class="card">
                  ${fotos.length ? `<button class="foto" data-g="${g}">
                    <img src="${esc(fotos[0])}" alt="${esc(p.nombre)}" loading="lazy">
                    ${fotos.length > 1 ? `<span class="mas-fotos">${fotos.length} fotos</span>` : ""}
                  </button>` : ""}
                  ${p.nombre || p.detalle || p.precio ? `<div class="info">
                    ${p.nombre ? `<p class="nombre">${esc(p.nombre)}</p>` : ""}
                    ${p.detalle ? `<p class="detalle">${esc(p.detalle)}</p>` : ""}
                    ${p.precio ? `<p class="precio">${esc(p.precio)}</p>` : ""}
                  </div>` : ""}
                </article>`;
              }).join("")}</div>`
            : `<div class="vacio">Próximamente</div>`;
          return `<section class="sub" data-sub="${sec.id}">
              <h2>${esc(sec.titulo)} <small>${sec.productos.length || ""}</small></h2>
              ${items}
            </section>`;
        }).join("");
      });
    }
    armar();

    // ----- Fotos subidas a las carpetas: se agregan solas, sin tocar código -----
    // El nombre del archivo se separa con " - ": primero el nombre, después el precio (lo que
    // empieza con "$") y el talle u otro detalle, en cualquier orden:
    //   "Pantalón - Talle 38 - $40.000.jpg"  ->  Pantalón / Talle 38 / $40.000
    // Varias fotos del mismo producto: mismo nombre con (2), (3)...:
    //   "Pantalón - Talle 38 - $40.000.jpg", "Pantalón (2).jpg", "Pantalón (3).jpg"
    // Los nombres automáticos de cámara/celular ("IMG_1234", "WhatsApp Image ...") no se muestran.
    const numeroDeFoto = (archivo) => +(archivo.match(/\((\d+)\)\.[^.]+$/)?.[1] || 1);
    function productoDesdeArchivo(archivo) {
      const partes = archivo.replace(/\.[^.]+$/, "").replace(/\s*\(\d+\)$/, "").split(" - ").map((x) => x.trim()).filter(Boolean);
      let nombre = partes.shift() || "";
      const precio = partes.filter((x) => x.startsWith("$")).join(" ");
      const detalle = partes.filter((x) => !x.startsWith("$")).join(" · ");
      if (/^(img|dsc|dscn|pxl|image|photo|whatsapp image)([\s_-]|\d|$)/i.test(nombre)) nombre = "";
      return { nombre, precio, detalle, fotos: [archivo] };
    }

    async function cargarFotos() {
      const { usuario, nombre, rama } = REPOSITORIO;
      const clave = "catalogo-fotos";
      let rutas;
      try {
        const r = await fetch(`https://api.github.com/repos/${usuario}/${nombre}/git/trees/${rama}?recursive=1`);
        if (!r.ok) throw new Error(r.status);
        rutas = (await r.json()).tree.filter((x) => x.type === "blob").map((x) => x.path);
        try { localStorage.setItem(clave, JSON.stringify(rutas)); } catch {}
      } catch {
        // Sin conexión con GitHub (o demasiadas visitas seguidas): usar la última lista guardada
        try { rutas = JSON.parse(localStorage.getItem(clave)); } catch {}
      }
      if (!rutas) return;

      let hayNuevas = false;
      CATALOGO.forEach((cat) => cat.secciones.forEach((sec) => {
        const carpeta = `fotos/${cat.id}/${sec.id}/`;
        const yaCargadas = new Set(sec.productos.flatMap(fotosDe));
        const porNombre = new Map();
        rutas
          .filter((ruta) => ruta.startsWith(carpeta) && /\.(jpe?g|png|webp|gif|avif)$/i.test(ruta))
          .map((ruta) => ruta.slice(carpeta.length))
          .filter((archivo) => !archivo.includes("/") && !yaCargadas.has(archivo))
          .sort((a, b) => numeroDeFoto(a) - numeroDeFoto(b) || a.localeCompare(b, "es", { numeric: true }))
          .forEach((archivo) => {
            const nuevo = productoDesdeArchivo(archivo);
            const clave = nuevo.nombre.toLowerCase();
            const existente = clave && porNombre.get(clave);
            if (existente) {
              existente.fotos.push(archivo);
              existente.precio ||= nuevo.precio;
              existente.detalle ||= nuevo.detalle;
            } else {
              if (clave) porNombre.set(clave, nuevo);
              sec.productos.push(nuevo);
            }
            hayNuevas = true;
          });
      }));
      if (hayNuevas) {
        const y = window.scrollY;
        armar();
        desdeHash();
        window.scrollTo({ top: y });
      }
    }

    // ----- Mostrar una categoría: todas sus subdivisiones ("Ver todo") o una sola -----
    function mostrar(catId, subId) {
      const cat = CATALOGO.find((c) => c.id === catId) || CATALOGO[0];
      const sub = cat.secciones.find((s) => s.id === subId);
      document.querySelectorAll(".tab").forEach((t) =>
        t.setAttribute("aria-selected", t.dataset.cat === cat.id));
      document.querySelectorAll(".categoria").forEach((d) =>
        d.hidden = d.dataset.cat !== cat.id);
      document.querySelectorAll(`.categoria[data-cat="${cat.id}"] section.sub`).forEach((s) =>
        s.hidden = !!sub && s.dataset.sub !== sub.id);

      const total = cat.secciones.reduce((n, s) => n + s.productos.length, 0);
      const chip = (id, titulo, n) =>
        `<button class="chip${(sub ? sub.id : "") === id ? " active" : ""}" data-sub="${id}">${esc(titulo)}${
          n ? `<span class="count">${n}</span>` : ""}</button>`;
      chipsEl.innerHTML = chip("", "Ver todo", total) +
        cat.secciones.map((s) => chip(s.id, s.titulo, s.productos.length)).join("");
      chipsEl.dataset.cat = cat.id;
      chipsEl.querySelector(".active")?.scrollIntoView({ block: "nearest", inline: "nearest" });

      history.replaceState(null, "", "#" + cat.id + (sub ? "-" + sub.id : ""));
      window.scrollTo({ top: 0 });
    }

    tabsEl.addEventListener("click", (e) => {
      const t = e.target.closest(".tab");
      if (t) mostrar(t.dataset.cat);
    });
    chipsEl.addEventListener("click", (e) => {
      const c = e.target.closest(".chip");
      if (c) mostrar(chipsEl.dataset.cat, c.dataset.sub);
    });

    // ----- Botón volver arriba -----
    const arriba = document.getElementById("arriba");
    window.addEventListener("scroll", () =>
      arriba.classList.toggle("visible", window.scrollY > 400), { passive: true });
    arriba.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

    // ----- Abrir desde un link (#caballo = ver todo, #caballo-mandiles = una subdivisión) -----
    function desdeHash() {
      const hash = location.hash.slice(1);
      const cat = CATALOGO.find((c) => hash === c.id || hash.startsWith(c.id + "-")) || CATALOGO[0];
      mostrar(cat.id, hash.slice(cat.id.length + 1));
    }
    window.addEventListener("hashchange", desdeHash);
    desdeHash();
    cargarFotos();

    // ----- Visor de fotos (con flechas si el producto tiene varias) -----
    const visorImg = visor.querySelector("img");
    const [btnAnt, btnSig] = visor.querySelectorAll(".flecha");
    let galeria = null, indice = 0;

    function verFoto(i) {
      indice = (i + galeria.fotos.length) % galeria.fotos.length;
      visorImg.src = galeria.fotos[indice];
      visorImg.alt = galeria.nombre;
      const n = galeria.fotos.length;
      visor.querySelector("p").textContent =
        [galeria.nombre, n > 1 ? `${indice + 1} / ${n}` : ""].filter(Boolean).join(" · ");
      btnAnt.hidden = btnSig.hidden = n < 2;
    }

    mainEl.addEventListener("click", (e) => {
      const b = e.target.closest("button.foto");
      if (!b) return;
      galeria = galerias[b.dataset.g];
      verFoto(0);
      visor.showModal();
    });
    btnAnt.onclick = (e) => { e.stopPropagation(); verFoto(indice - 1); };
    btnSig.onclick = (e) => { e.stopPropagation(); verFoto(indice + 1); };
    visor.addEventListener("click", () => visor.close());
    visor.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") verFoto(indice - 1);
      if (e.key === "ArrowRight") verFoto(indice + 1);
    });
    let toqueX = null;
    visor.addEventListener("touchstart", (e) => { toqueX = e.touches[0].clientX; }, { passive: true });
    visor.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - toqueX;
      if (Math.abs(dx) > 40 && galeria.fotos.length > 1) {
        verFoto(indice + (dx < 0 ? 1 : -1));
        e.preventDefault(); // no cerrar el visor al deslizar
      }
    });
  </script>
</body>
</html>
